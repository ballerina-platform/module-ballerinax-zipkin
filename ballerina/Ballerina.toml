[package]
org = "ballerinax"
name = "zipkin"
version = "1.1.0"
distribution = "2201.14.0"

[build-options]
sticky = true

[platform.java25]
graalvmCompatible = true

[[platform.java25.dependency]]
path = "../native/build/libs/zipkin-extension-native-1.1.0-SNAPSHOT.jar"
groupId = "ballerina"
artifactId = "zipkin-extension-native"
version = "1.1.0-SNAPSHOT"

[[platform.java25.dependency]]
path = "./lib/opentelemetry-exporter-zipkin-1.64.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-exporter-zipkin"
version = "1.64.0"

[[platform.java25.dependency]]
path = "./lib/opentelemetry-sdk-trace-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-sdk-trace"
version = "1.65.0"

[[platform.java25.dependency]]
path = "./lib/opentelemetry-sdk-common-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-sdk-common"
version = "1.65.0"

[[platform.java25.dependency]]
path = "./lib/opentelemetry-semconv-1.43.0.jar"
groupId = "io.opentelemetry.semconv"
artifactId = "opentelemetry-semconv"
version = "1.43.0"

[[platform.java25.dependency]]
path = "./lib/opentelemetry-extension-trace-propagators-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-extension-trace-propagators"
version = "1.65.0"

[[platform.java25.dependency]]
path = "./lib/zipkin-2.27.1.jar"
groupId = "io.zipkin.zipkin2"
artifactId = "zipkin"
version = "2.27.1"

[[platform.java25.dependency]]
path = "./lib/zipkin-reporter-3.5.3.jar"
groupId = "io.zipkin.reporter2"
artifactId = "zipkin-reporter"
version = "3.5.3"

[[platform.java25.dependency]]
path = "./lib/zipkin-sender-okhttp3-3.5.3.jar"
groupId = "io.zipkin.reporter2"
artifactId = "zipkin-sender-okhttp3"
version = "3.5.3"

[[platform.java25.dependency]]
path = "./lib/okhttp-4.12.0.jar"
groupId = "com.squareup.okhttp3"
artifactId = "okhttp"
version = "4.12.0"

[[platform.java25.dependency]]
path = "./lib/okio-jvm-3.6.0.jar"
groupId = "com.squareup.okio"
artifactId = "okio-jvm"
version = "3.6.0"

[[platform.java25.dependency]]
path = "./lib/kotlin-stdlib-1.9.10.jar"
groupId = "org.jetbrains.kotlin"
artifactId = "kotlin-stdlib"
version = "1.9.10"

[[platform.java25.dependency]]
path = "./lib/guava-32.1.2-jre.jar"
groupId = "com.google.guava"
artifactId = "guava"
version = "32.1.2-jre"

[[platform.java25.dependency]]
path = "./lib/failureaccess-1.0.1.jar"
groupId = "com.google.guava"
artifactId = "failureaccess"
version = "1.0.1"
